          First three pages:
            description: First three pages
            summary: Several pages in one call
            value:
            - 1
            - 2
            - 3
        explode: true
        in: query
        name: pages
        required: true
        schema:
          items:
            example: 1
            format: int32
            type: integer
          maxItems: 10
          minItems: 1
          type: array
          default: null
        style: form
