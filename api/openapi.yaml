        explode: true
        in: query
        name: pageIndex
        required: false
        schema:
          default: 0
          format: int32
          minimum: 0
          type: integer
        style: form
      responses:
        "500":
          content:
            application/json:
              examples:
                Internal error:
                  description: Internal error
                  summary: Generic 500 payload
                  value:
                    timestamp: 2026-04-23T04:06:51Z
                    status: 500
                    error: Internal Server Error
                    message: corpus not found
                    path: /v1/corpus/id
