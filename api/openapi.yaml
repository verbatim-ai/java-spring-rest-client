              examples:
                Invalid content type error:
                  description: Invalid content type error
                  summary: Generic 415 payload
                  value:
                    timestamp: 2026-04-23T04:06:51Z
                    status: 415
                    error: invalid content type
                    message: application/json is not supported
                    path: /v1/corpus/id
              schema:
                $ref: "#/components/schemas/Error"
          description: Content type not accepted by the platform. See `GET /v1/doc/accept`
            for the list of supported types.
        "403":
          content:
            application/json:
              examples:
