  securitySchemes:
    JWT:
      bearerFormat: JWT
      description: "RSA512-signed JWT bearer token issued by your backend. Send as\
        \ `Authorization: Bearer <token>`. The token must carry an `oid` claim (organization\
        \ ID) to be considered onboarded. Firebase-issued tokens are accepted on `/_/v1/`\
        \ private endpoints; RSA-signed tokens are required on `/_/v1/access-token`\
        \ (access-token management)."
      in: header
      scheme: bearer
      type: http
    AccessToken:
      description: "Short-lived opaque access token issued by `POST /_/v1/access-token/`.\
        \ Send as the `X-Access-Token: <token>` request header. Grants the same access\
        \ as an onboarded JWT scoped to the token's organization. Valid on all `/v1/`\
        \ GET endpoints; **not** accepted on `/_/v1/` management endpoints."
      in: header
      name: X-Access-Token
      type: apiKey

