      parameters:
      - description: ID of the document.
        example: 123e4567-e89b-12d3-a456-426614174000
        explode: false
        in: path
        name: docId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "One-based page indices to issue preview URLs for. Required:\
          \ 1 to 10 values per request, each within the document's page range. Repeat\
          \ for multiple values: `pages=1&pages=2`."
        examples:
          First page:
            description: First page
            summary: A single page
            value:
